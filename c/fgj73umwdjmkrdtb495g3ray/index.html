<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero ecommerce — reporte por cliente</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up:#006300; --down:#d03b3b;
  --demo-bg:#fdf6e3; --demo-ink:#7a5a00; --demo-line:#e8d9a8;
  --acc:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --up:#0ca30c; --down:#d03b3b;
    --demo-bg:#2a2416; --demo-ink:#e0c877; --demo-line:#4a3f1e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --up:#0ca30c; --down:#d03b3b;
  --demo-bg:#2a2416; --demo-ink:#e0c877; --demo-line:#4a3f1e;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

 
header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;font-weight:650;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px}
.spacer{flex:1}
button.ghost{
  background:var(--surface);border:1px solid var(--ring);color:var(--ink2);
  border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;
}
button.ghost:hover{color:var(--ink)}

.banner{
  background:var(--demo-bg);border:1px solid var(--demo-line);color:var(--demo-ink);
  border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:18px;
}
.banner b{font-weight:650}

 
.filters{
  display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  padding:14px 16px;margin-bottom:8px;
}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
select{
  font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;
  border:1px solid var(--ring);background:var(--plane);color:var(--ink);min-width:150px;
}
 
.sticky{
  position:sticky;top:0;z-index:20;background:var(--plane);
  padding:10px 0 8px;margin:0 0 8px;
}
.brand{
  display:flex;align-items:center;gap:16px;margin:0;
  background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  padding:14px 18px;border-left:4px solid var(--acc);
}
.brand .logo{
  height:44px;background:#fff;border-radius:8px;padding:6px 12px;
  display:flex;align-items:center;box-shadow:0 0 0 1px rgba(11,11,11,.07) inset;
}
.brand .logo img{height:32px;display:block}
   
  .brand .logo.alto{height:56px;padding:4px 10px}
  .brand .logo.alto img{height:48px}
.brand .mono{
  width:44px;height:44px;border-radius:10px;flex:none;
  background:var(--acc);color:#fff;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;letter-spacing:.02em;
}
.brand .bname{font-size:17px;font-weight:650;line-height:1.2}
.brand .bsub{font-size:12.5px;color:var(--muted)}
.brand .spacer{flex:1}
.brand .nologo{font-size:12px;color:var(--muted);text-align:right;max-width:230px}

.months{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 22px}
.mchip{
  font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--ring);background:var(--surface);color:var(--ink2);
}
.mchip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.mchip:disabled{opacity:.32;cursor:not-allowed}
.mchip.all{font-weight:600}

 
.card{
  background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  padding:18px 20px;margin-bottom:16px;
}
.card h2{font-size:14px;font-weight:650;margin:0 0 3px}
.card .note{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.demo-tag{
  display:inline-block;vertical-align:2px;margin-left:8px;
  background:var(--demo-bg);color:var(--demo-ink);border:1px solid var(--demo-line);
  border-radius:5px;padding:1px 7px;font-size:10.5px;font-weight:650;
  letter-spacing:.05em;text-transform:uppercase;
}

 
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1000px){.hero{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.hero .card{margin:0;display:flex;flex-direction:column;justify-content:space-between}
.klabel{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kbig{font-size:38px;font-weight:640;line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
.kbig.accent{color:var(--acc)}
.deltas{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.delta b{font-weight:650}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

 
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.tile .v{font-size:23px;font-weight:620;margin-top:5px;letter-spacing:-.01em}
.tile .d{font-size:12px;margin-top:3px}

 
.chart{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.tick{font-size:11px;fill:var(--muted)}
.tick.num{font-variant-numeric:tabular-nums}
.dlabel{font-size:11px;fill:var(--ink2);font-variant-numeric:tabular-nums}

#tip{
  position:fixed;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--surface);border:1px solid var(--ring);border-radius:9px;
  padding:9px 12px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);
  z-index:50;max-width:250px;
}
#tip .tt{font-weight:650;margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--ink2)}
#tip .tr b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

 
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center}
.hb .nm{font-size:13px;color:var(--ink2);margin-bottom:4px}
.hb .track{height:9px;border-radius:4px;background:var(--grid);overflow:hidden}
.hb .fill{height:100%;border-radius:4px}
.hb .val{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}

 
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
td{font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--plane)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill svg{width:11px;height:11px}
.p-crit{background:rgba(208,59,59,.13);color:var(--crit)}
.p-ser{background:rgba(236,131,90,.16);color:var(--serious)}
.p-warn{background:rgba(250,178,25,.18);color:#8a6100}
.p-good{background:rgba(12,163,12,.13);color:var(--good)}
:root[data-theme="dark"] .p-warn{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .p-warn{color:var(--warn)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.two .card{margin:0}
details{margin-top:6px}
summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:6px 0}
.scroll{overflow-x:auto}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
</style>
</head>

<details>

</details>

</div>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];



let sel = {c: 'BullPadel', a: 2026, m: 7};   

 
const nf = new Intl.NumberFormat('es-AR');
const money = v => v == null ? '—' : '$ ' + nf.format(Math.round(v));
const moneyK = v => {
  if (v == null) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return '$' + (v/1e9).toFixed(1).replace('.',',') + 'MM';
  if (a >= 1e6) return '$' + (v/1e6).toFixed(1).replace('.',',') + 'M';
  if (a >= 1e3) return '$' + Math.round(v/1e3) + 'k';
  return '$' + Math.round(v);
};
const num = v => v == null ? '—' : nf.format(Math.round(v));
const pct = (v, d=2) => v == null ? '—' : (v*100).toFixed(d).replace('.',',') + '%';
const dec = (v, d=2) => v == null ? '—' : v.toFixed(d).replace('.',',');

 
function tile(rotulo, valor, act, ant, anioPasado){
  const linea = (etiq, contra) =>
    (contra == null || act == null)
      ? ''
      : `<div class="d">${delta(act, contra)} <span style="color:var(--muted)">${etiq}</span></div>`;
  const sinNada = (ant == null || act == null) && (anioPasado == null || act == null);
  return `<div class="tile">
    <div class="klabel">${rotulo}</div>
    <div class="v">${valor}</div>
    ${linea(tileEtiqPrev, ant)}
    ${linea(tileEtiqYoy, anioPasado)}
    ${sinNada ? '<div class="d flat">sin comparación</div>' : ''}
  </div>`;
}
let tileEtiqPrev = 'vs mes anterior', tileEtiqYoy = 'vs año anterior';

function delta(cur, prev, invert=false){
  if (cur == null || prev == null || prev === 0) return '<span class="flat">sin comparación</span>';
  const r = (cur - prev) / Math.abs(prev);
  const cls = Math.abs(r) < 0.005 ? 'flat' : ((r > 0) !== invert ? 'up' : 'down');
  const ar = Math.abs(r) < 0.005 ? '' : (r > 0 ? '↑ ' : '↓ ');
  return `<span class="${cls}">${ar}${(Math.abs(r)*100).toFixed(1).replace('.',',')}%</span>`;
}

/* ---------- acceso a datos ---------- */
const rows = c => D.real[c];
const row = (c,a,m) => rows(c).find(r => r.a===a && r.m===m) || null;
const yearRows = (c,a) => { const o=[]; for(let m=1;m<=12;m++) o.push(row(c,a,m)); return o; };
const dm = (c,a,m) => D.demo[c]['' + a + '-' + String(m).padStart(2,'0')] || null;
const years = c => [...new Set(rows(c).map(r=>r.a))].sort((x,y)=>y-x);

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = 0;

/* ---------- gráfico: barras verticales por mes ---------- */
function barsByMonth(id, data, opts){
  const W=880, H=opts.h||190, L=58, R=14, T=14, B=26;
  const iw = W-L-R, ih = H-T-B;
  const vals = data.map(d=>d.v).filter(v=>v!=null);
  if (!vals.length) return `<div class="empty">Sin datos para este año.</div>`;
  const max = Math.max(...vals) * 1.1 || 1;
  const bw = iw/12, pad = bw*0.22;
  let g = '';
  // grid
  for (let i=0;i<=3;i++){
    const y = T + ih - ih*i/3;
    g += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text class="tick num" x="${L-8}" y="${y+4}" text-anchor="end">${opts.fmtAxis(max*i/3)}</text>`;
  }
  data.forEach((d,i)=>{
    const x = L + bw*i + pad;
    const w = bw - pad*2;
    if (d.v == null){
      g += `<text class="tick" x="${x+w/2}" y="${T+ih-6}" text-anchor="middle" opacity=".45">·</text>`;
    } else {
      const h = Math.max(3, ih * d.v/max);
      const y = T + ih - h;
      const on = (i+1) === sel.m;
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"
              fill="${opts.color}" opacity="${on?1:0.42}"/>`;
      if (on) g += `<text class="dlabel" x="${x+w/2}" y="${y-6}" text-anchor="middle" font-weight="600">${opts.fmtLabel(d.v)}</text>`;
    }
    g += `<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}" fill="transparent"
            data-i="${i}" class="hit"/>`;
    g += `<text class="tick" x="${L+bw*i+bw/2}" y="${H-8}" text-anchor="middle"
            ${ (i+1)===sel.m ? 'font-weight="600" fill="var(--ink)"':''}>${MES[i]}</text>`;
  });
  g += `<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--axis)" stroke-width="1"/>`;
  setTimeout(()=>attach(id, data, opts), 0);
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img"
            aria-label="${opts.aria}">${g}</svg>`;
}

/* ---------- gráfico: línea por mes ---------- */
function lineByMonth(id, data, opts){
  const W=880, H=opts.h||190, L=58, R=14, T=14, B=26;
  const iw = W-L-R, ih = H-T-B;
  const vals = data.map(d=>d.v).filter(v=>v!=null);
  if (!vals.length) return `<div class="empty">Sin datos para este año.</div>`;
  const max = Math.max(...vals)*1.15 || 1;
  const bw = iw/12;
  const px = i => L + bw*i + bw/2;
  const py = v => T + ih - ih*v/max;
  let g='';
  for (let i=0;i<=3;i++){
    const y = T + ih - ih*i/3;
    g += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text class="tick num" x="${L-8}" y="${y+4}" text-anchor="end">${opts.fmtAxis(max*i/3)}</text>`;
  }
  // segmentos (solo entre puntos consecutivos con dato)
  for (let i=0;i<11;i++){
    if (data[i].v!=null && data[i+1].v!=null)
      g += `<line x1="${px(i)}" y1="${py(data[i].v)}" x2="${px(i+1)}" y2="${py(data[i+1].v)}"
              stroke="${opts.color}" stroke-width="2" stroke-linecap="round"/>`;
  }
  data.forEach((d,i)=>{
    if (d.v!=null){
      const on = (i+1)===sel.m;
      g += `<circle cx="${px(i)}" cy="${py(d.v)}" r="${on?6:4.5}" fill="${opts.color}"
              stroke="var(--surface)" stroke-width="2"/>`;
      if (on) g += `<text class="dlabel" x="${px(i)}" y="${py(d.v)-13}" text-anchor="middle" font-weight="600">${opts.fmtLabel(d.v)}</text>`;
    }
    g += `<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
    g += `<text class="tick" x="${px(i)}" y="${H-8}" text-anchor="middle"
            ${ (i+1)===sel.m ? 'font-weight="600" fill="var(--ink)"':''}>${MES[i]}</text>`;
  });
  g += `<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--axis)" stroke-width="1"/>`;
  setTimeout(()=>attach(id, data, opts), 0);
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img"
            aria-label="${opts.aria}">${g}</svg>`;
}

/* ---------- gráfico: barras apiladas por mes ---------- */
function stackByMonth(id, data, opts){
  const W=880, H=opts.h||190, L=58, R=14, T=14, B=26;
  const iw=W-L-R, ih=H-T-B;
  const tot = data.map(d => d.a==null?null:(d.a+d.b));
  const vals = tot.filter(v=>v!=null);
  if(!vals.length) return `<div class="empty">Sin datos para este año.</div>`;
  const max = Math.max(...vals)*1.1||1;
  const bw=iw/12, pad=bw*0.22;
  let g='';
  for(let i=0;i<=3;i++){
    const y=T+ih-ih*i/3;
    g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text class="tick num" x="${L-8}" y="${y+4}" text-anchor="end">${num(max*i/3)}</text>`;
  }
  data.forEach((d,i)=>{
    const x=L+bw*i+pad, w=bw-pad*2;
    if(d.a!=null){
      const ha=ih*d.a/max, hb=ih*d.b/max;
      const on=(i+1)===sel.m;
      const op = on?1:0.45;
      g+=`<rect x="${x}" y="${T+ih-ha}" width="${w}" height="${Math.max(2,ha)}" rx="4" fill="var(--s1)" opacity="${op}"/>`;
      g+=`<rect x="${x}" y="${T+ih-ha-hb-2}" width="${w}" height="${Math.max(2,hb)}" rx="4" fill="var(--s2)" opacity="${op}"/>`;
    }
    g+=`<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
    g+=`<text class="tick" x="${L+bw*i+bw/2}" y="${H-8}" text-anchor="middle"
          ${(i+1)===sel.m?'font-weight="600" fill="var(--ink)"':''}>${MES[i]}</text>`;
  });
  g+=`<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--axis)" stroke-width="1"/>`;
  setTimeout(()=>attach(id,data,opts),0);
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria}">${g}</svg>`;
}

function attach(id, data, opts){
  const svg = document.getElementById(id);
  if (!svg) return;
  svg.querySelectorAll('.hit').forEach(h => {
    h.style.cursor = 'pointer';
    h.addEventListener('mousemove', e => {
      const i = +h.dataset.i;
      const html = opts.tip(data[i], i);
      if (html) showTip(e, html); else hideTip();
    });
    h.addEventListener('mouseleave', hideTip);
    h.addEventListener('click', () => { sel.m = +h.dataset.i + 1; render(); });
  });
}

/* ---------- barras horizontales ---------- */
function hbars(items, color, fmt){
  const max = Math.max(...items.map(i=>i.v)) || 1;
  return `<div class="hbars">` + items.map(i => `
    <div>
      <div class="nm">${i.n}</div>
      <div class="hb">
        <div class="track"><div class="fill" style="width:${(i.v/max*100).toFixed(1)}%;background:${color}"></div></div>
        <div class="val">${fmt(i.v)}</div>
      </div>
    </div>`).join('') + `</div>`;
}

/* ---------- agregados de año completo ---------- */
function aggYear(c, a, soloMeses){
  let rs = rows(c).filter(r => r.a === a);
  if (soloMeses) rs = rs.filter(r => soloMeses.includes(r.m));
  if (!rs.length) return null;
  const sum = k => { const v = rs.map(r=>r[k]).filter(x=>x!=null); return v.length?v.reduce((x,y)=>x+y,0):null; };
  const v = sum('v'), f = sum('f'), s = sum('s'), i = sum('i');
  return {a, m:0, v, f, s, i,
          t: (v&&f)?f/v:null,
          tc:(v&&s)?v/s:null,
          meses: rs.length};
}
function aggDemo(c, a, soloMeses){
  let base = rows(c).filter(r=>r.a===a);
  if (soloMeses) base = base.filter(r=>soloMeses.includes(r.m));
  const rs = base.map(r=>dm(c,a,r.m)).filter(Boolean);
  if (!rs.length) return null;
  const un = rs.reduce((x,r)=>x+r.un,0);
  const rec = rs.reduce((x,r)=>x+r.rec,0);
  const nue = rs.reduce((x,r)=>x+r.nue,0);
  const byName = {};
  rs.forEach(r => r.top.forEach(p => {
    byName[p.n] = byName[p.n] || {n:p.n,u:0,f:0};
    byName[p.n].u += p.u; byName[p.n].f += p.f;
  }));
  const top = Object.values(byName).sort((x,y)=>y.f-x.f);
  const avg = key => {
    const m = {};
    rs.forEach(r => r[key].forEach(p => m[p.n] = (m[p.n]||0) + p.p/rs.length));
    return Object.entries(m).map(([n,p])=>({n,p})).sort((x,y)=>y.p-x.p);
  };
  return {ppt: un/(rec+nue), un, rec, nue, top, pagos: avg('pagos'), cuotas: avg('cuotas')};
}

    ? (parcial ? `${a}, de ${MES[mesesAct[0]-1]} a ${MES[mesesAct[mesesAct.length-1]-1]}` : `${a}`)

  tileEtiqPrev = anual ? (parcial ? `vs ${a-1}` : `vs ${a-1}`) : 'vs mes anterior';

  H += `<div class="hero">

// Se abre en el último mes CERRADO, no en el que está corriendo. El mes en curso
// siempre está a medias: agosto con 3 ventas contra julio con 129 da -97%, que asusta
// y no dice nada. El mes actual sigue estando a un clic.
const HOY = new Date();
function anyMonth(c,a){
  const r = rows(c).filter(x=>x.a===a);
  if (!r.length) return 1;
  const esActual = m => a === HOY.getFullYear() && m === HOY.getMonth()+1;
  for (let i=r.length-1; i>=0; i--)
    if (!esActual(r[i].m) && r[i].tc != null) return r[i].m;
  for (let i=r.length-1; i>=0; i--) if (!esActual(r[i].m)) return r[i].m;
  return r[r.length-1].m;
}

function renderTable(){ if (sel.c === 'Comparar marcas') { var _t = document.getElementById('tbl'); if (_t) _t.innerHTML = ''; return; }
  const {c,a} = sel;
  const yr = yearRows(c,a);
  document.getElementById('tbl').innerHTML = `<table>
    <thead><tr><th>Mes</th><th>Ventas</th><th>Facturación</th><th>Ticket prom.</th>
      <th>Sesiones</th><th>Tasa conv.</th><th>Inversión</th>
      <th>Prod./ticket</th></tr></thead>
    <tbody>${yr.map((r,i)=>{
      const dd = r ? dm(c,a,i+1) : null;
      return `<tr><td>${MESL[i]}</td>
        <td>${r?num(r.v):'—'}</td><td>${r?money(r.f):'—'}</td>
        <td>${r?money(r.t):'—'}</td><td>${r?num(r.s):'—'}</td>
        <td>${r?pct(r.tc):'—'}</td><td>${r?money(r.i):'—'}</td>
        <td>${dd?dec(dd.ppt):'—'}</td></tr>`;
    }).join('')}</tbody></table>`;
}

function esOscuro(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
function avisoDe(c){
  const meses = Object.keys(D.demo[c] || {}).sort();
  const el = document.getElementById('aviso');
  if (!meses.length){
    el.style.display = '';
    el.innerHTML = '<b>Este cliente todavía no tiene el detalle cargado.</b> Ventas, ' +
      'facturación, sesiones e inversión son reales, pero productos por ticket, top ' +
      'productos, medios de pago y stock empiezan a juntarse desde que se conecte la tienda.';
    return;
  }
  const desde = meses[0], hasta = meses[meses.length - 1];
  el.style.display = (meses.length >= 7) ? 'none' : '';
  el.innerHTML = '<b>Detalle disponible de ' + desde + ' a ' + hasta + '.</b> ' +
    'Antes de esa fecha hay ventas y facturación, pero no productos por ticket ' +
    'ni top productos: el detalle se junta desde que se conectó la tienda.';
}

// Antes, un cliente sin ficha caía en la de Luboloque y mostraba SU logo. Ahora se le
// arma una neutra con las iniciales, hasta que le carguemos el logo de verdad.
function marcaGenerica(c){
  const ini = String(c).split(/\s+/).filter(Boolean).slice(0,2)
                .map(function(p){ return p[0].toUpperCase(); }).join('');
  return {nombre:c, logo:'', mono: ini || '?', fondo:'#ffffff',
          s1:'#1baf7a', s1d:'#199e70', s2:'#eb6834', s2d:'#d95926'};
}

function aplicarMarca(c){
  const M = MARCAS[c] || marcaGenerica(c);
  const d = esOscuro();
  const r = document.documentElement.style;
  r.setProperty('--acc', d ? M.s1d : M.s1);
  r.setProperty('--s1',  d ? M.s1d : M.s1);
  r.setProperty('--s2',  d ? M.s2d : M.s2);
  document.getElementById('brand').innerHTML = `
    <div class="brand">
      ${M.logo
        ? `<div class="logo${M.alto?' alto':''}" style="background:${M.fondo||'#fff'}"><img src="${M.logo}" alt="${M.nombre}"></div>`
        : `<div class="mono">${M.mono}</div>`}
      <div>
        <div class="bname">${M.nombre}</div>
        <div class="bsub">Tablero de KPIs de ecommerce${M.plataforma ? ' · ' + M.plataforma : ''}</div>
      </div>
      <div class="spacer"></div>
      ${M.logo ? '' : '<div class="nologo">Sin logo cargado — pasame el archivo y queda con la identidad de la marca.</div>'}
    </div>`;
}

var CMP_KEY = 'Comparar marcas';

function cmpMiles(n){
  n = Math.round(Number(n) || 0);
  var neg = n < 0; n = Math.abs(n);
  var s = String(n), out = '';
  while (s.length > 3) { out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? '-' : '') + s + out;
}
function cmpMoney(n){ return '$ ' + cmpMiles(n); }
function cmpNum(n){ return cmpMiles(n); }
function cmpPct(n, dec){
  var d = (dec === undefined) ? 1 : dec;
  return (Number(n) || 0).toFixed(d).replace('.', ',') + '%';
}
function cmpOscuro(){ try { return esOscuro(); } catch (e) { return false; } }
function cmpColor(c){
  var M = (typeof MARCAS !== 'undefined' && MARCAS[c]) ? MARCAS[c] : null;
  var osc = cmpOscuro();
  if (!M) return osc ? '#8aa0b8' : '#5b6b7d';
  return osc ? (M.s1d || M.s1) : (M.s1 || M.s1d);
}
function cmpNombre(c){
  var M = (typeof MARCAS !== 'undefined' && MARCAS[c]) ? MARCAS[c] : null;
  return (M && M.nombre) ? M.nombre : c;
}
function cmpMarcas(){
  return (D.clientes || []).filter(function (c) { return c !== CMP_KEY; });
}
function cmpFilas(a, m){
  return cmpMarcas().map(function (c) {
    var ms = (D.real[c] || []).filter(function (o) {
      return Number(o.a) === Number(a) && (!m || Number(o.m) === Number(m));
    });
    var v = 0, f = 0, s = 0, i = 0;
    ms.forEach(function (o) {
      v += Number(o.v) || 0; f += Number(o.f) || 0;
      s += Number(o.s) || 0; i += Number(o.i) || 0;
    });
    return { c: c, v: v, f: f, s: s, i: i,
             t: v ? f / v : 0,
             tc: s ? (v / s) * 100 : 0,
             invf: f ? (i / f) * 100 : 0 };
  }).filter(function (r) { return r.v || r.f || r.s || r.i; })
    .sort(function (x, y) { return y.f - x.f; });
}
function cmpCaja(){
  return 'border:1px solid rgba(127,127,127,.28);border-radius:12px;padding:14px 16px;margin:0 0 14px';
}
function cmpBarra(valor, maximo, color){
  var w = maximo > 0 ? Math.max(2, Math.round((valor / maximo) * 100)) : 0;
  return '<div style="height:100%;border-radius:4px;background:' + color + ';width:' + w + '%"></div>';
}
function cmpPanel(filas, campo, rotulo, fmt, ayuda){
  var vals = filas.map(function (r) { return Number(r[campo]) || 0; });
  var max = Math.max.apply(null, vals.concat([0]));
  var h = '<div style="' + cmpCaja() + '">';
  h += '<div style="font-weight:600">' + rotulo + '</div>';
  h += '<div style="opacity:.6;font-size:12px;margin-bottom:10px">' + (ayuda || '&nbsp;') + '</div>';
  filas.forEach(function (r) {
    h += '<div style="display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;margin:8px 0">';
    h += '<div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + cmpNombre(r.c) + '</div>';
    h += '<div style="height:8px;border-radius:4px;background:rgba(127,127,127,.14)">' + cmpBarra(Number(r[campo]) || 0, max, cmpColor(r.c)) + '</div>';
    h += '<div style="text-align:right;font-size:13px;font-variant-numeric:tabular-nums">' + fmt(r[campo]) + '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}
function cmpCelda(txt, fuerte){
  return '<td style="text-align:right;padding:7px 8px;font-variant-numeric:tabular-nums' +
         (fuerte ? ';font-weight:600' : '') + '">' + txt + '</td>';
}
function cmpRender(){
  var cont = document.getElementById('main');
  var tb = document.getElementById('tbl');
  var av = document.getElementById('aviso');
  var sb = document.getElementById('sub');
  if (tb) tb.innerHTML = '';
  if (av) av.innerHTML = '';
  var a = sel.a, m = sel.m;
  var periodo = m ? (MESL[m - 1] + ' de ' + a) : ('Ano ' + a + ' completo');
  if (sb) sb.textContent = 'Todas las marcas · ' + periodo;
  if (!cont) return;
  var filas = cmpFilas(a, m);
  if (!filas.length) {
    cont.innerHTML = '<div style="' + cmpCaja() + '">No hay datos cargados para ' + periodo + '.</div>';
    return;
  }
  var tot = { v: 0, f: 0, s: 0, i: 0 };
  filas.forEach(function (r) { tot.v += r.v; tot.f += r.f; tot.s += r.s; tot.i += r.i; });
  tot.t = tot.v ? tot.f / tot.v : 0;
  tot.tc = tot.s ? (tot.v / tot.s) * 100 : 0;
  tot.invf = tot.f ? (tot.i / tot.f) * 100 : 0;

  var enc = ['Marca','Ventas','Facturacion','% del total','Ticket','Sesiones','Conversion','Inversion','Inv./Fact.'];
  var h = '<div style="' + cmpCaja() + ';overflow-x:auto">';
  h += '<div style="font-weight:600;margin-bottom:10px">Todas las marcas · ' + periodo + '</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>';
  enc.forEach(function (t, i) {
    h += '<th style="padding:6px 8px;font-weight:600;opacity:.7;text-align:' + (i ? 'right' : 'left') + '">' + t + '</th>';
  });
  h += '</tr></thead><tbody>';
  filas.forEach(function (r) {
    h += '<tr style="border-top:1px solid rgba(127,127,127,.22)">';
    h += '<td style="padding:7px 8px;white-space:nowrap"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' +
         cmpColor(r.c) + ';margin-right:7px"></span>' + cmpNombre(r.c) + '</td>';
    h += cmpCelda(cmpNum(r.v));
    h += cmpCelda(cmpMoney(r.f));
    h += cmpCelda(cmpPct(tot.f ? (r.f / tot.f) * 100 : 0));
    h += cmpCelda(cmpMoney(r.t));
    h += cmpCelda(r.s ? cmpNum(r.s) : '—');
    h += cmpCelda(r.s ? cmpPct(r.tc, 2) : '—');
    h += cmpCelda(r.i ? cmpMoney(r.i) : '—');
    h += cmpCelda((r.i && r.f) ? cmpPct(r.invf) : '—');
    h += '</tr>';
  });
  h += '<tr style="border-top:2px solid rgba(127,127,127,.45)">';
  h += '<td style="padding:7px 8px;font-weight:600">Total</td>';
  h += cmpCelda(cmpNum(tot.v), 1);
  h += cmpCelda(cmpMoney(tot.f), 1);
  h += cmpCelda('100,0%', 1);
  h += cmpCelda(cmpMoney(tot.t), 1);
  h += cmpCelda(tot.s ? cmpNum(tot.s) : '—', 1);
  h += cmpCelda(tot.s ? cmpPct(tot.tc, 2) : '—', 1);
  h += cmpCelda(tot.i ? cmpMoney(tot.i) : '—', 1);
  h += cmpCelda((tot.i && tot.f) ? cmpPct(tot.invf) : '—', 1);
  h += '</tr></tbody></table>';
  h += '<div style="opacity:.6;font-size:12px;margin-top:10px">Un guion quiere decir que esa marca todavia no tiene ese dato cargado. ' +
       'El ticket y la conversion se recalculan sobre todo el periodo: no son el promedio de los meses.</div>';
  h += '</div>';

  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px">';
  h += cmpPanel(filas, 'f', 'Facturacion', cmpMoney, 'Ordenado de mayor a menor');
  h += cmpPanel(filas, 'v', 'Ventas', cmpNum, 'Ordenes pagadas');
  h += cmpPanel(filas, 't', 'Ticket promedio', cmpMoney, 'Facturacion sobre ventas');
  h += cmpPanel(filas, 's', 'Sesiones', cmpNum, 'De Google Analytics');
  h += cmpPanel(filas, 'tc', 'Tasa de conversion', function (x) { return cmpPct(x, 2); }, 'Ventas sobre sesiones');
  h += cmpPanel(filas, 'i', 'Inversion en Meta', cmpMoney, 'Lo gastado en publicidad');
  h += cmpPanel(filas, 'invf', 'Inversion sobre facturacion', cmpPct, 'Cuanto mas bajo, mejor');
  h += '</div>';
  cont.innerHTML = h;
}
(function cmpInit(){
  try {
    if (typeof D === 'undefined' || !D.real || !D.clientes) return;
    
    if (D.soloCliente) {
      var fcu = document.getElementById('fc');
      if (fcu) fcu.disabled = true;
      return;
    }
    var acc = {};
    cmpMarcas().forEach(function (c) {
      (D.real[c] || []).forEach(function (o) {
        var k = o.a + '-' + o.m;
        if (!acc[k]) acc[k] = { a: Number(o.a), m: Number(o.m), v: 0, f: 0, s: 0, i: 0, top: [], pagos: [], cuotas: [], nue: 0, rec: 0, u: 0, ppt: 0 };
        acc[k].v += Number(o.v) || 0; acc[k].f += Number(o.f) || 0;
        acc[k].s += Number(o.s) || 0; acc[k].i += Number(o.i) || 0;
        acc[k].nue += Number(o.nue) || 0; acc[k].rec += Number(o.rec) || 0;
        acc[k].u += Number(o.u) || 0;
      });
    });
    var arr = Object.keys(acc).map(function (k) {
      var o = acc[k];
      o.t = o.v ? o.f / o.v : 0;
      o.tc = o.s ? (o.v / o.s) * 100 : 0;
      o.ppt = o.v ? o.u / o.v : 0;
      return o;
    }).sort(function (x, y) { return (x.a - y.a) || (x.m - y.m); });
    D.real[CMP_KEY] = arr;
    if (D.stock && !D.stock[CMP_KEY]) D.stock[CMP_KEY] = [];
    if (D.clientes.indexOf(CMP_KEY) === -1) D.clientes.push(CMP_KEY);
    var fc = document.getElementById('fc');
    if (fc) {
      var ya = false;
      for (var i = 0; i < fc.options.length; i++) { if (fc.options[i].value === CMP_KEY) ya = true; }
      if (!ya) {
        var op = document.createElement('option');
        op.value = CMP_KEY;
        op.textContent = CMP_KEY;
        fc.appendChild(op);
      }
    }
  } catch (e) { }
})();
 




(function botonLinks(){
  try {
    if (typeof D === 'undefined' || D.soloCliente || !D.links) return;
    
    
    
    var tema = document.getElementById('theme');
    var cabecera = (tema && tema.parentNode) ? tema.parentNode : document.body;
    if (!cabecera) return;

    var oscuro = false;
    try { oscuro = esOscuro(); } catch (e) { oscuro = false; }
    var estiloBoton = 'cursor:pointer;font:inherit;font-size:13px;padding:7px 13px;border-radius:9px;' +
      'border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'btnLinks';
    btn.textContent = 'Links';
    btn.style.cssText = estiloBoton + ';margin-right:8px';

    
    var fondo = document.createElement('div');
    fondo.id = 'fondoLinks';
    fondo.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);' +
      'z-index:9999;align-items:center;justify-content:center;padding:24px';

    var caja = document.createElement('div');
    caja.style.cssText = 'max-width:720px;width:100%;max-height:80vh;overflow:auto;border-radius:16px;' +
      'padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);' +
      (oscuro ? 'background:#161a1f;color:#e8eaed' : 'background:#ffffff;color:#1f2933');

    var cerrar = document.createElement('button');
    cerrar.type = 'button';
    cerrar.textContent = 'X';
    cerrar.style.cssText = estiloBoton + ';float:right;padding:4px 10px';

    var titulo = document.createElement('div');
    titulo.textContent = 'Links de clientes';
    titulo.style.cssText = 'font-weight:600;font-size:16px;margin-bottom:4px';

    var bajada = document.createElement('div');
    bajada.textContent = 'Compartí el link de cada cliente — solo verán sus propios datos.';
    bajada.style.cssText = 'opacity:.65;font-size:13px;margin-bottom:16px';

    caja.appendChild(cerrar);
    caja.appendChild(titulo);
    caja.appendChild(bajada);

    Object.keys(D.links).sort().forEach(function (cli) {
      var fila = document.createElement('div');
      fila.style.cssText = 'display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;' +
        'padding:8px 0;border-top:1px solid rgba(127,127,127,.22)';

      var nombre = document.createElement('div');
      nombre.textContent = cli;
      nombre.style.cssText = 'font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';

      var campo = document.createElement('input');
      campo.type = 'text';
      campo.readOnly = true;
      campo.value = D.links[cli];
      campo.title = D.links[cli];
      campo.style.cssText = 'font:inherit;font-size:12px;padding:6px 9px;border-radius:8px;width:100%;' +
        'border:1px solid rgba(127,127,127,.4);background:rgba(127,127,127,.10);color:inherit';
      campo.addEventListener('focus', function () { campo.select(); });

      var copiar = document.createElement('button');
      copiar.type = 'button';
      copiar.textContent = 'Copiar';
      copiar.style.cssText = estiloBoton;
      copiar.addEventListener('click', function () {
        campo.select();
        var listo = false;
        try { listo = document.execCommand('copy'); } catch (e) { listo = false; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try { navigator.clipboard.writeText(campo.value); listo = true; } catch (e) {}
        }
        copiar.textContent = listo ? 'Copiado' : 'Copialo a mano';
        setTimeout(function () { copiar.textContent = 'Copiar'; }, 1800);
      });

      fila.appendChild(nombre);
      fila.appendChild(campo);
      fila.appendChild(copiar);
      caja.appendChild(fila);
    });

    fondo.appendChild(caja);

    function abrir() { fondo.style.display = 'flex'; }
    function ocultar() { fondo.style.display = 'none'; }
    btn.addEventListener('click', abrir);
    cerrar.addEventListener('click', ocultar);
    fondo.addEventListener('click', function (ev) { if (ev.target === fondo) ocultar(); });

    function asegurarBoton() {
      if (!btn.parentNode) {
        if (tema && tema.parentNode) { tema.parentNode.insertBefore(btn, tema); }
        else if (cabecera.appendChild) { cabecera.appendChild(btn); }
      }
    }
    if (tema && tema.parentNode && tema.parentNode.insertBefore) {
      tema.parentNode.insertBefore(btn, tema);
    } else {
      cabecera.appendChild(btn);
    }
    if (document.body && document.body.appendChild) document.body.appendChild(fondo);

    
    try {
      var renderOriginal = render;
      render = function () {
        var r = renderOriginal.apply(null, arguments);
        asegurarBoton();
        return r;
      };
    } catch (e) { }
  } catch (e) { }
})();
 

</script>
